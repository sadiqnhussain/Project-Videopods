{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <title>
      {% block title %}
        Videopods
      {% endblock %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
    <script>
      window.VP_URLS = {
        home: "{% url 'landing' %}",
        login: "{% url 'login' %}",
        register: "{% url 'register' %}",
        dashboard: "{% url 'dashboard' %}",
        meetingEnded: "{% url 'meeting-ended' %}",
        notFound: "{% url 'not-found' %}",
        authToken: "{% url 'token-obtain' %}",
        authRefresh: "{% url 'token-refresh' %}",
        authMe: "{% url 'auth-me' %}",
        authRegister: "{% url 'register-api' %}",
        authGoogle: "{% url 'google-auth' %}",
        authGoogleConfig: "{% url 'google-config' %}",
        meetingCreate: "{% url 'meeting-create' %}",
        meetingHistory: "{% url 'meeting-history' %}",
        meetingHistoryDeleteAll: "{% url 'meeting-history-delete-all' %}",
        meetingUpcoming: "{% url 'meeting-upcoming' %}",
        meetingRtcConfig: "{% url 'rtc-config' %}",
        meetingDetailTemplate: "{% url 'meeting-detail' '00000000-0000-0000-0000-000000000000' %}",
        meetingStartTemplate: "{% url 'meeting-start' '00000000-0000-0000-0000-000000000000' %}",
        meetingEndTemplate: "{% url 'meeting-end' '00000000-0000-0000-0000-000000000000' %}",
        meetingCancelTemplate: "{% url 'meeting-cancel' '00000000-0000-0000-0000-000000000000' %}",
        meetingHistoryDeleteTemplate: "{% url 'meeting-history-delete' '00000000-0000-0000-0000-000000000000' %}",
        meetingPageTemplate: "{% url 'meeting' '00000000-0000-0000-0000-000000000000' %}"
      }
      window.VP_WS = { meetingPrefix: '{{ websocket_meeting_prefix|escapejs }}' }
    </script>
    {% block head %}

    {% endblock %}
  </head>
  <body class="{% block body_class %}

    {% endblock %}">
    <header class="topbar">
      <a class="brand" href="{% url 'landing' %}">Videopods</a>
      <nav id="site-nav">
        <span id="nav-signed-out"><a href="{% url 'login' %}">Sign in</a><a class="nav-cta" href="{% url 'register' %}">Get started</a></span>
        <span id="nav-signed-in" class="hidden nav-user"><strong id="nav-user-name"></strong><button id="logout-btn" class="nav-logout">Logout</button></span>
      </nav>
    </header>
    <main>
      {% block content %}

      {% endblock %}
    </main>
    <script src="{% static 'js/auth.js' %}"></script>
    {% block scripts %}

    {% endblock %}
  </body>
</html>
